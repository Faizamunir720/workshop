name: Deploy

on:
  push:
    branches: [main]

env:
  SSH_HOST: faiza.comsats.shakir.blog
  SSH_PORT: "2280"
  SSH_USER: faiza
  REMOTE_DIR: public_html/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find public -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Virus scan (ClamAV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo freshclam
          clamscan -r --infected public/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -az --delete --exclude 'config.php' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key" \
            public/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
